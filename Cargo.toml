[package]
description = "Stupidly fast directory deletion"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "dirkill"
version = "0.3.0"

# Publishing profile for building the binary
[profile.release-publish]
codegen-units = 1
inherits = "release"
lto = true
strip = true

[dependencies]
anyhow = "1.0"
bytesize = "1.3"
cfg-if = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
crossbeam-channel = "0.5"
# Version 0.26 and up has a bug where [`event::read`] returns twice
crossterm = "0.28"
dunce = "1.0"
flume = "0.11.1"
quork = { version = "0.8", features = ["lock_api", "spin"] }
ratatui = "0.29"
strip-ansi-escapes = "0.2"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full", "tracing"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
walkdir = "2.5"

[dev-dependencies]
fs_extra = "1.3"
rstest = "0.24"
