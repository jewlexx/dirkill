[package]
description = "Stupidly fast directory deletion"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "dirkill"
version = "0.3.0"

# Publishing profile for building the binary
[profile.release-publish]
codegen-units = 1
inherits = "release"
lto = true
strip = true

[dependencies]
anyhow = "1.0"
bytesize = "2.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
flume = "0.11"
quork = { version = "0.9", features = ["lock_api", "spin"] }
ratatui = "0.29"
spinners = "4.1"
strip-ansi-escapes = "0.2"
tokio = { version = "1.42", features = ["full", "tracing"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
walkdir = "2.5"

[dev-dependencies]
fs_extra = "1.3"
rstest = "0.25"
