[package]
description = "Stupidly fast directory deletion"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "dirkill"
version = "0.2.1"

# Publishing profile for building the binary
[profile.release-publish]
codegen-units = 1
inherits = "release"
lto = true
strip = true

[dependencies]
anyhow = "1.0.94"
bytesize = "1.3.0"
cfg-if = "1.0.0"
chrono = "0.4.39"
clap = { version = "4.5.23", features = ["derive"] }
colored = "3.0.0"
crossbeam-channel = "0.5.15"
# Version 0.26 and up has a bug where [`event::read`] returns twice
crossterm = "0.28.1"
dunce = "1.0.5"
parking_lot = "0.12.3"
quork = { version = "0.8.1", features = ["lock_api", "spin"] }
ratatui = "0.29.0"
strip-ansi-escapes = "0.2"
thiserror = "2.0.7"
tokio = { version = "1.42.0", features = ["full", "tracing"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.19"
walkdir = "2.5.0"

[dev-dependencies]
fs_extra = "1.3.0"
rstest = "0.24.0"
